# 构建并发布多架构镜像到 ghcr.io。
#
# 本工作流**只推镜像、不产 Artifacts**：部署方式统一为 docker compose pull，
# 不需要离线 tar 包。镜像名固定为 ghcr.io/<owner>/workbuddy2api-suite。
#
# 触发：
#   * push main        → 构建并推 latest + sha-<short>
#   * push tag v*      → 构建并推 latest + 版本号 + sha-<short>
#   * 每日定时         → 跟随上游漂移（vendored 快照由人工 sync，这里只是保证
#                        镜像始终可重建，避免基础镜像层失效后无法复现）
#   * 手动
name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # 每天北京时间 12:00 = UTC 04:00
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 同一分支的重复推送取消旧任务，避免排队
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 先验证，再构建镜像 ────────────────────────────────────
  # 把上游自带的三套测试作为构建前置门禁：上游的测试就是它逆向成果的护栏
  # （风控头、错误码表、SSE 白名单），测试红着就不该出镜像。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 补丁校验放最前：补丁锚点若因上游重构而失效，后面所有测试都没意义
      # （测的是没打补丁的代码）。这一步把「上游改了、补丁要跟着改」
      # 变成一次明确的 CI 失败，而不是静默的功能退化。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify integration patches apply cleanly
        run: |
          rm -rf /tmp/patched && mkdir -p /tmp/patched
          cp -r vendor/wb2api vendor/manager /tmp/patched/
          # 补丁脚本自带 fail-fast 断言（锚点找不到即非零退出），失败会中断本步
          python docker/patches/apply.py /tmp/patched

          # 补丁必须真的落到文件里，不能只"没报错"
          grep -q "Proxy: http.ProxyFromEnvironment" \
            /tmp/patched/wb2api/internal/upstream/transport.go \
            || { echo "::error::补丁 2 未生效（transport.go 缺少 Proxy 字段）"; exit 1; }
          grep -q "_internal_direct_mounts" \
            /tmp/patched/manager/server/config.py \
            || { echo "::error::补丁 1 未生效（config.py 缺少 mounts 逻辑）"; exit 1; }

          # 反向断言：更新器**不得**被补丁改动。
          # 上游已用 can_update_upstream 做能力驱动判定，我们改用上游的能力，
          # 不再自己改它的更新逻辑（见 UPSTREAMS.md「曾经打过、现已删除的补丁」）。
          if grep -q "集成补丁" /tmp/patched/manager/server/services/updater.py; then
            echo "::error::更新器被打了补丁 —— 应改用上游的 can_update_upstream 能力驱动"
            exit 1
          fi

          # 顶部"发现新版本"弹窗必须已被移除。用它对 sessionStorage 写的标记键
          # 作为判据 —— 那个键只属于被移除的那个 useEffect，最不容易误判。
          if grep -q "update-notified" \
              /tmp/patched/manager/web/components/common/layout/ManagementBar.tsx; then
            echo "::error::顶部"发现新版本"弹窗未被移除（ManagementBar 补丁未生效）"
            exit 1
          fi

          # 正向断言：overlay 必须真的落位。
          # 更新面板是**整文件覆写**而不是打补丁，所以这里验证"我们的文件在"，
          # 而不是验证"没有补丁标记" —— 后者对覆写文件毫无意义。
          PANEL=/tmp/patched/manager/web/components/common/settings/UpdatePanel.tsx
          grep -q "SUITE-OVERLAY" "$PANEL" \
            || { echo "::error::更新面板未被覆写 —— overlay 没落位"; exit 1; }
          # 上游 test_docker_deploy::test_frontend_uses_capability_flag 断言本文件
          # 必须出现该标志（用意：界面要把能力边界透出来）。覆写时丢掉它会让 CI 红。
          grep -q "can_update_upstream" "$PANEL" \
            || { echo "::error::更新面板丢了 can_update_upstream 能力标志"; exit 1; }
          for f in server/services/suite.py server/routers/suite.py; do
            test -f "/tmp/patched/manager/$f" \
              || { echo "::error::套件更新后端缺失：$f"; exit 1; }
          done
          grep -q "suite_router" /tmp/patched/manager/server/main.py \
            || { echo "::error::main.py 未注册套件路由"; exit 1; }
          # i18n：新增命名空间必须落到**全部**语系（漏一个，上游 i18n 测试就红）
          for loc in zh-CN zh-TW en ja ko; do
            grep -q '"suiteUpdate"' "/tmp/patched/manager/web/lib/i18n/locales/$loc.json" \
              || { echo "::error::$loc.json 缺少 suiteUpdate 文案"; exit 1; }
          done
          echo "补丁校验通过（文本补丁 + 面板覆写 + 新增后端 + i18n 均已落位）"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: vendor/wb2api/go.sum

      # 在**打过补丁**的副本上编译与测试：镜像里跑的就是这份代码，
      # 测未打补丁的 vendor/ 会漏掉补丁引入的编译问题。
      #
      # ── 为什么固定 TZ=Asia/Shanghai ──
      # 上游 `cmd/stats` 的标题渲染用 `t.Local()`（见 cmd/stats/main.go），
      # 而它的测试把期望值硬编码成了 UTC+8 的渲染结果
      # （`自 09-14 20:43`，对应时间戳 2026-09-14T20:43:52+08:00）。
      # GitHub runner 默认 UTC → 渲染成 12:43 → 该测试必挂。
      #
      # 固定为 Asia/Shanghai 有两个作用：
      #   1. 与测试的期望一致；
      #   2. **与本发行版容器内的时区一致**（见 docker/Dockerfile 的 TZ），
      #      因此 CI 验证的环境更贴近实际运行环境。
      #
      # 注：这是上游测试的缺陷（测试未冻结时区），不是本项目的改动。
      # 上游修好后本设置仍可保留 —— 固定时区本身是好事，
      # 避免测试结果随 runner 的默认时区变化。
      #
      # 实现细节：Linux 上 Go 的 initLocal() 读 $TZ 并到
      # /usr/share/zoneinfo/<TZ> 找时区文件（见 Go 源码 zoneinfo_unix.go），
      # 因此**必须有 tzdata**。runner 通常自带，这里显式安装以防万一。
      - name: Install tzdata (for TZ in tests)
        run: |
          if [ ! -f /usr/share/zoneinfo/Asia/Shanghai ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq tzdata
          fi
          ls -l /usr/share/zoneinfo/Asia/Shanghai

      - name: Go build / vet / test (patched)
        working-directory: /tmp/patched/wb2api
        env:
          TZ: Asia/Shanghai
        run: |
          # 留一行时区证据：若将来 tzdata 或 TZ 传递出问题，
          # 失败的会是 cmd/stats 的时区断言，届时看这里就能定位。
          echo "runner 时区：$(date '+%Z %z')"
          go build ./...
          go vet ./...
          go test ./...

      - name: Python tests (patched)
        working-directory: /tmp/patched/manager
        run: |
          python -m pip install --quiet -r server/requirements.txt
          # 先建好 data/：deploy/update.py 把数据目录默认取成 <install_dir>/data，
          # 并在那里写 upstream-local-changes.patch 备份；而
          # ComposeCommandTest::test_missing_compose_raises_actionable_error 用的是
          # **假 Reporter**，不会像真实流程那样 mkdir。
          #
          # 上游仓库并不跟踪 data/（已核实），所以**干净检出上这条测试必然
          # FileNotFoundError** —— 上游自己的 CI 能过，只是因为开发者的工作区里
          # 恰好有这个目录。这里按"已安装"的布局先把目录建好：这是补上测试预设
          # 的前提，不是绕过测试（断言本身照常执行）。
          mkdir -p data
          python -m unittest discover -s server/tests -t . -v

      # 本发行版自己的测试（套件版本语义、tag 挑选、侧车鉴权、状态契约）。
      # 跑在**打过补丁**的树上，因为被测的 server/services/suite.py 与
      # server/routers/suite.py 正是由 apply.py 落位进去的。
      - name: Suite tests (our own overlay code)
        env:
          PYTHONPATH: /tmp/patched/manager
        run: python -m unittest discover -s tests -t tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vendor/manager/web/package-lock.json

      # ⚠️ 必须构建**打过补丁**的那份前端，而不是 vendor/manager/web。
      # 更新面板（整文件覆写）与新 i18n 文案都在补丁后的树里：构建未打补丁的树
      # 等于没有校验我们的 TSX —— 类型错误会一路漏到 Docker 构建才炸，
      # 而那时报错信息离原因更远。
      - name: Frontend static export (patched)
        working-directory: /tmp/patched/manager/web
        run: |
          npm ci
          npm run build:export
          test -f out/index.html

  # ── 构建并推送镜像 ────────────────────────────────────────
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 从 upstreams.json 读上游 commit，作为构建参数注入镜像标签（血统）。
      # 用 Python 而不是 jq：runner 上 python3 一定有。
      - name: Read upstream pins
        id: pins
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open('upstreams.json', encoding='utf-8') as fh:
              up = json.load(fh)['upstreams']
          print(f"wb2api={up['wb2api']['commit']}")
          print(f"manager={up['manager']['commit']}")
          print(f"wb2api_short={up['wb2api']['commit'][:7]}")
          print(f"manager_short={up['manager']['commit'][:7]}")
          PY

      # ghcr 镜像名必须全小写：github.repository 可能含大写
      - name: Compute image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          NAME="${{ steps.image.outputs.name }}"
          SHORT="${GITHUB_SHA::7}"
          {
            echo "list<<EOF"
            # 每次构建都有：精确到提交，永不移动
            echo "${NAME}:sha-${SHORT}"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              # 打 tag = 发版：latest 与版本号标签一起指向它
              TAG="${GITHUB_REF#refs/tags/}"
              echo "${NAME}:latest"
              echo "${NAME}:${TAG}"
              echo "${NAME}:${TAG#v}"
            else
              # 非 tag 构建（main 推送 / 每日定时 / 手动触发）：只更新 main
              echo "${NAME}:main"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── 为什么 `latest` **只在打 tag 时**移动 ──────────────
      # 「一键更新」拉取的是 `SUITE_IMAGE` 指向的标签（默认 `:latest`），
      # 而面板的「本套件」区块是拿**当前镜像里的版本号**与仓库里最新的
      # `vX.Y.Z` git tag 比较。两者必须指同一个东西，功能才能收敛：
      #
      #   若 latest 每次 main 推送都移动 →
      #     跑 main 构建（sha-xxx）时面板说"最新正式版 v1.2.3，有更新"，
      #     点更新却拉到又一个 main 构建（sha-yyy），版本仍是 sha 形态、
      #     面板继续说"有更新" —— **永远收敛不到它承诺的那个版本**。
      #
      #   改成 latest 只在 tag 时移动后：
      #     tag v1.2.4 → latest 指向 v1.2.4 → 面板提示有更新 →
      #     点更新拉到 v1.2.4 → 镜像内版本号变成 v1.2.4 → 面板显示"已是最新"。✓
      #
      # 想跟 main 的人改用 `:main`（跟随最新 main 构建）或 `:sha-xxxxxxx`
      # （钉死到某次提交），不要再依赖 `latest`。
      #
      # ⚠️ 因此**必须先打第一个 tag**：在此之前 `latest` 不会更新
      # （旧值还在，但不再移动），全新仓库上更是不存在。

      # 套件版本：写入镜像的 OCI 标签（org.opencontainers.image.version）、
      # 环境变量 WB_SUITE_VERSION 与文件 /opt/suite/version（见 docker/Dockerfile）。
      #
      # ⚠️ 它**参与**面板的版本检测 —— 面板「系统更新」第一段「本套件」
      # 显示的就是它：当前版本 vs 仓库里最新的 `vX.Y.Z` git tag。
      # （上游 manager 的版本号是**另一条线**，在面板第二、三段显示。）
      #
      # 优先用 git tag（vX.Y.Z）；没有 tag 时用 sha-<short>，
      # 面板会把后者如实显示为「开发构建」而不参与版本比较。
      #
      # ⚠️ **tag 格式要求：以 `v` 开头、分段全是数字**。这条只写在这里 ——
      #    README 面向部署方，打 tag 是维护者的事，不该混在一起。
      #      触发 CI 的条件是 `v*`（见本文件顶部的 on.push.tags）：
      #        1.2.3 / release-1.2.3  → **不触发构建**
      #      面板的 parse_semver 只认 ^v?\d+(\.\d+)*$：
      #        v1.2.3   ✅ 正式版，参与版本比较
      #        v1.2     ✅ 等价 v1.2.0（按缺位补 0 比较）
      #        v1.2.3-rc1 ❌ 会触发构建，但面板当成**开发构建**（非纯数字）
      #    打错 tag 要撤时注意：`latest` 已经被指过去了，删 tag 后需重新推一个
      #    正确的 tag 让它回正（见上面「为什么 latest 只在打 tag 时移动」）。
      - name: Compute suite version
        id: suite
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/}"
          else
            V="sha-${GITHUB_SHA::7}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "套件版本（仅作镜像标签）: ${V}"

      - name: Build & push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # 血统注入镜像标签，docker inspect 可直接查到捆的是哪两个 commit
          build-args: |
            GITHUB_REPOSITORY=${{ github.repository }}
            WB2API_COMMIT=${{ steps.pins.outputs.wb2api }}
            MANAGER_COMMIT=${{ steps.pins.outputs.manager }}
            SUITE_VERSION=${{ steps.suite.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 镜像已发布

          本次推送的标签：

          \`\`\`
          ${{ steps.tags.outputs.list }}
          \`\`\`

          平台：linux/amd64, linux/arm64

          > \`latest\` **只在打 tag 时移动**（= 最新正式版）；非发版构建只更新
          > \`main\` 与 \`sha-*\`。原因见 build.yml 的「为什么 latest 只在打 tag 时移动」。

          ### 捆绑的上游版本

          | 上游 | Commit |
          |---|---|
          | Sliverkiss/workbuddy2api | \`${{ steps.pins.outputs.wb2api_short }}\` |
          | ithtelab/workbuddy-manager | \`${{ steps.pins.outputs.manager_short }}\` |

          部署（\`SUITE_IMAGE\` 默认用 \`latest\` = 最新正式版）：

          \`\`\`bash
          docker compose pull && docker compose up -d
          \`\`\`
          EOF
